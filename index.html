<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3e3">
<meta name="description" content="be honest. i can take it. (i can’t.)">
<meta property="og:type" content="website">
<meta property="og:title" content="do you hate me?">
<meta property="og:description" content="be honest. i can take it. (i can’t.)">
<meta property="og:image" content="https://moonlitnghts.github.io/do-you-hate-me/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://moonlitnghts.github.io/do-you-hate-me/og-image.png">
<title>do you hate me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3e3;--bg2:#ffe0d0;--card:#fffaf3;--ink:#4b2e2b;--soft:#8a655c;--pink:#ff8fa3;--yes:#ffe2b8;--yesh:#ffd08f;--body:#ffeedd;--cheek:#ff9fae;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a1f;--bg2:#3a2530;--card:#33242b;--ink:#ffeedd;--soft:#d3b1a8;--yes:#5b3c44;--yesh:#704a54;--body:#f7dec9}}
:root[data-theme="dark"]{--bg:#241a1f;--bg2:#3a2530;--card:#33242b;--ink:#ffeedd;--soft:#d3b1a8;--yes:#5b3c44;--yesh:#704a54;--body:#f7dec9}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;display:grid;place-items:center;overflow-x:hidden;color:var(--ink);background:radial-gradient(circle at 12% 18%,var(--bg2),transparent 45%),radial-gradient(circle at 88% 82%,var(--bg2),transparent 45%),var(--bg);font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif}
[hidden]{display:none!important}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.deco span{position:absolute;font-size:clamp(24px,5vw,40px);opacity:.5}
main{position:relative;z-index:1;width:min(92vw,620px);margin:24px auto;padding:clamp(18px,4vw,34px);text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink)}
.mascot{width:clamp(140px,38vw,190px);height:auto;animation:bob 3.2s ease-in-out infinite}
.mm,.tear{opacity:0;transition:opacity .2s}
[data-mood="idle"] .m-idle,[data-mood="worried"] .m-wavy,[data-mood="sad"] .m-sad,[data-mood="happy"] .m-happy,[data-mood="sad"] .tear{opacity:1}
#eyes{transition:transform .12s}
.say{display:inline-block;margin:4px 0 0;padding:8px 16px;max-width:92%;font-size:15px;background:var(--yes);border:2px solid var(--ink);border-radius:18px}
h1{margin:12px 0 4px;font-size:clamp(36px,10vw,56px);line-height:1.05}
.sub{margin:0 0 22px;color:var(--soft)}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{font:inherit;font-weight:600;font-size:clamp(17px,4.6vw,20px);padding:11px 22px;color:var(--ink);background:var(--yes);border:2px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;transform:rotate(var(--r,0deg)) scale(var(--s,1));transition:transform .12s,box-shadow .12s,background .2s}
.opts>.opt:nth-child(odd){--r:-1.6deg}
.opts>.opt:nth-child(even){--r:1.3deg}
.opt:hover{background:var(--yesh);transform:translateY(-3px) rotate(calc(var(--r,0deg) * -1))}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.no{--r:0deg;background:var(--pink);color:#4b2e2b}
.no:hover{background:var(--pink)}
.no.fled{position:fixed;z-index:20;margin:0;transition:left .3s cubic-bezier(.34,1.56,.64,1),top .3s cubic-bezier(.34,1.56,.64,1),transform .3s}
.no.fled:hover{transform:rotate(var(--r,0deg)) scale(var(--s,1))}
.slot{display:inline-block}
.meta{margin:20px 0 0;font-size:14px;color:var(--soft)}
.wow{margin:8px 0 0;font-size:clamp(40px,12vw,68px);letter-spacing:.02em;animation:wob 1.4s ease-in-out}
.knew{margin:6px 0 10px;font-size:clamp(28px,8vw,44px);font-weight:600;opacity:0;text-decoration:underline wavy var(--pink);text-underline-offset:8px}
.detail{margin:0 0 18px;color:var(--soft);opacity:0}
#again,#share{opacity:0}
.go .knew{animation:fade .7s 1.6s forwards}
.go .detail{animation:fade .7s 2.6s forwards}
.go #again,.go #share{animation:fade .7s 3.2s forwards}
.h{position:absolute;left:var(--x);top:150px;color:var(--pink);font-size:22px;pointer-events:none;animation:up 1.7s ease-out forwards}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wob{0%{transform:scale(.6)}40%{transform:scale(1.12) rotate(-2deg)}70%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes up{from{opacity:1}to{opacity:0;transform:translateY(-150px) rotate(var(--rot))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><span style="left:6%;top:12%">🧸</span><span style="left:84%;top:16%">☕</span><span style="left:10%;top:74%">🧦</span><span style="left:86%;top:70%">🍪</span><span style="left:46%;top:4%">✨</span><span style="left:50%;top:90%">🕯️</span></div>
<main id="main">
<svg id="face" class="mascot" data-mood="idle" viewBox="0 0 200 180" role="img" aria-label="A round, fluffy little character with rosy cheeks">
<ellipse cx="100" cy="170" rx="56" ry="8" fill="#4b2e2b" opacity=".12"/>
<circle cx="50" cy="42" r="20" fill="var(--body)" stroke="var(--ink)" stroke-width="4"/>
<circle cx="150" cy="42" r="20" fill="var(--body)" stroke="var(--ink)" stroke-width="4"/>
<circle cx="50" cy="42" r="9" fill="var(--cheek)" opacity=".7"/>
<circle cx="150" cy="42" r="9" fill="var(--cheek)" opacity=".7"/>
<path d="M100 24c54 0 88 32 88 74s-34 70-88 70S12 140 12 98 46 24 100 24z" fill="var(--body)" stroke="var(--ink)" stroke-width="4"/>
<ellipse cx="48" cy="114" rx="14" ry="9" fill="var(--cheek)" opacity=".75"/>
<ellipse cx="152" cy="114" rx="14" ry="9" fill="var(--cheek)" opacity=".75"/>
<g id="eyes"><circle cx="72" cy="94" r="9" fill="var(--ink)"/><circle cx="128" cy="94" r="9" fill="var(--ink)"/><circle cx="75" cy="90" r="3" fill="#fff"/><circle cx="131" cy="90" r="3" fill="#fff"/></g>
<g fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round">
<path class="mm m-idle" d="M88 118q12 10 24 0"/><path class="mm m-wavy" d="M86 120q7-8 14 0t14 0"/><path class="mm m-sad" d="M88 126q12-12 24 0"/><path class="mm m-happy" d="M84 114q16 20 32 0"/>
</g>
<path class="tear" d="M70 106q-8 12 0 20q8-8 0-20z" fill="#8fd3ff" stroke="var(--ink)" stroke-width="2"/>
<path class="tear" d="M130 106q-8 12 0 20q8-8 0-20z" fill="#8fd3ff" stroke="var(--ink)" stroke-width="2"/>
</svg>
<div><span class="say" id="say">be honest. i can take it. (i can’t.)</span></div>

<section id="question">
<h1>do you hate me?</h1>
<p class="sub">pick one. i’ll be brave.</p>
<div class="opts" id="opts">
<button class="opt">Yes</button><button class="opt">Definitely</button><button class="opt">Absolutely</button><button class="opt">For sure</button><button class="opt">A little</button><button class="opt">Obviously</button><button class="opt">Big time</button><button class="opt">Sometimes</button>
<span class="slot" id="holder"><button class="opt no" id="no" aria-label="No (this button runs away)">No</button></span>
</div>
<p class="meta" id="meta" hidden>the “no” button has escaped <b id="n">0</b> times</p>
</section>

<section id="result" role="status" aria-live="polite" hidden>
<h2 class="wow" id="wow"></h2>
<p class="knew" id="knew"></p>
<p class="detail" id="detail"></p>
<div class="opts"><button class="opt again" id="share">send this to someone</button><button class="opt again" id="again">wait, i misclicked</button></div>
</section>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const main = $("main"), face = $("face"), eyes = $("eyes"), say = $("say");
  const question = $("question"), result = $("result"), no = $("no"), holder = $("holder");
  const meta = $("meta"), count = $("n");
  const opts = Array.from(document.querySelectorAll(".opt:not(.no):not(.again)"));
  const details = {
    "Yes": "just “yes.” no hesitation. no notes.",
    "Definitely": "“definitely.” the confidence. i’m almost impressed.",
    "Absolutely": "“absolutely.” bold of you to say that to my face.",
    "For sure": "“for sure.” you didn’t even blink.",
    "A little": "“a little.” so a tiny part of you likes me?? i’m clinging to that.",
    "Obviously": "“obviously.” oh. so it’s THAT obvious.",
    "Big time": "“big time.” i’m going to go sit under a blanket now.",
    "Sometimes": "“sometimes.” honestly? fair. i hate me on tuesdays."
  };
  const quips = ["oh, it moved. weird.", "hehe. it’s shy.", "you almost had it!", "it doesn’t want to be picked.", "the no button has left the chat", "careful, it bites. (it doesn’t.)", "nope. not today.", "it’s doing its little dance", "wow, so determined", "it’s faster than it looks", "okay now you’re just bullying it", "this is the cardio portion", "respect the hustle. still no."];
  const alts = {
    "Yes": ["a “yes.” just one syllable of pure honesty."],
    "Definitely": ["“definitely.” you said it like a weather report."],
    "Absolutely": ["“absolutely.” not even a “well, maybe.” wow."],
    "For sure": ["“for sure.” at least you’re confident about it."],
    "A little": ["“a little.” i’ll take it. i’ll take a little."],
    "Obviously": ["“obviously.” and i thought we were having a nice time."],
    "Big time": ["“big time.” the bear is now emotionally damp."],
    "Sometimes": ["“sometimes.” the most honest answer. still ouch."]
  };
  const labels = ["No", "nope", "n-", "nah", "no?", "…", "no."];
  let fled = false, tries = 0, last = 0, rounds = 0, kb = 0, faking = false;

  const mood = (m) => { face.dataset.mood = m; };
  const nearest = (x, y, r) => Math.hypot(Math.max(r.left - x, 0, x - r.right), Math.max(r.top - y, 0, y - r.bottom));
  const hits = (a, b, pad) => !(a.right + pad < b.left || a.left - pad > b.right || a.bottom + pad < b.top || a.top - pad > b.bottom);

  function look(x, y) {
    const r = face.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1, k = Math.min(d, 200) / 200 * 5;
    eyes.style.transform = `translate(${dx / d * k}px, ${dy / d * k}px)`;
  }

  function flee(px, py) {
    const t = performance.now();
    if (t - last < 120) return;
    last = t;
    const r = no.getBoundingClientRect(), w = r.width, h = r.height;
    if (!fled) {
      holder.style.width = w + "px";
      holder.style.height = h + "px";
      no.style.left = r.left + "px";
      no.style.top = r.top + "px";
      no.classList.add("fled");
      fled = true;
      no.getBoundingClientRect();
    }
    const M = 14, T = 56;
    const maxX = innerWidth - w - M, maxY = innerHeight - h - M;
    const boxes = opts.map((o) => o.getBoundingClientRect());
    let best = [M, T], top = -Infinity;
    for (let i = 0; i < 24; i++) {
      const x = M + Math.random() * Math.max(1, maxX - M);
      const y = T + Math.random() * Math.max(1, maxY - T);
      const c = { left: x, top: y, right: x + w, bottom: y + h };
      const score = Math.hypot(x + w / 2 - px, y + h / 2 - py) - (boxes.some((b) => hits(c, b, 6)) ? 400 : 0);
      if (score > top) { top = score; best = [x, y]; }
    }
    no.style.left = best[0] + "px";
    no.style.top = best[1] + "px";
    no.style.setProperty("--r", (Math.random() * 24 - 12).toFixed(1) + "deg");
    tries++;
    no.textContent = labels[Math.min(tries, labels.length - 1)];
    no.style.setProperty("--s", Math.max(0.6, 1 - tries * 0.04).toFixed(2));
    count.textContent = tries;
    meta.hidden = false;
    say.textContent = tries <= quips.length ? quips[tries - 1] : quips[Math.floor(Math.random() * quips.length)];
    mood("worried");
  }

  function show(wowText, knewText, detailText, m) {
    question.hidden = true;
    result.hidden = false;
    no.hidden = true;
    $("wow").textContent = wowText;
    $("knew").textContent = knewText;
    $("detail").textContent = detailText;
    result.classList.remove("go");
    void result.offsetWidth;
    result.classList.add("go");
    mood(m);
    say.textContent = m === "sad" ? "…" : "(blushing)";
  }

  function hearts() {
    for (let i = 0; i < 12; i++) {
      const h = document.createElement("span");
      h.className = "h";
      h.textContent = "♥";
      h.style.setProperty("--x", 28 + Math.random() * 44 + "%");
      h.style.setProperty("--rot", (Math.random() * 60 - 30) + "deg");
      h.style.animationDelay = (Math.random() * 0.5) + "s";
      main.appendChild(h);
      setTimeout(() => h.remove(), 2400);
    }
  }

  opts.forEach((b) => b.addEventListener("click", () => {
    const label = b.textContent.trim();
    const pool = [details[label]].concat(alts[label] || []);
    rounds++;
    const knew = rounds < 3 ? "i knew it." : ["you keep coming back for this, huh.", "round " + rounds + ". still knew it.", "i knew it. i always know."][rounds % 3];
    show("wowwww…", knew, pool[Math.floor(Math.random() * pool.length)], "sad");
  }));

  no.addEventListener("click", (e) => {
    if (e.detail > 0) { e.preventDefault(); flee(e.clientX, e.clientY); return; }
    if (++kb < 3) { flee(innerWidth / 2, innerHeight / 2); say.textContent = "nice try, keyboard warrior"; return; }
    show("…no?", "huh. okay.", "wait, you actually got it?? how. i didn’t think anyone could. (i believe you. a little.)", "happy");
    hearts();
  });

  opts.forEach((b) => {
    const hope = b.textContent.trim() === "A little";
    b.addEventListener("pointerenter", () => {
      if (!result.hidden) return;
      mood(hope ? "happy" : "worried");
      say.textContent = hope ? "wait… is that a little?" : "oh no. here it comes.";
    });
    b.addEventListener("pointerleave", () => { if (result.hidden) mood(tries ? "worried" : "idle"); });
  });

  $("share").addEventListener("click", async () => {
    const data = { title: "do you hate me?", text: "be honest. i can take it. (i can’t.)", url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(location.href); say.textContent = "link copied! go bother someone."; }
    } catch (err) { /* share cancelled */ }
  });

  $("again").addEventListener("click", () => {
    result.hidden = true;
    question.hidden = false;
    no.hidden = false;
    no.classList.remove("fled");
    no.style.left = no.style.top = "";
    holder.style.width = holder.style.height = "";
    fled = false;
    kb = 0;
    no.textContent = "No";
    no.style.setProperty("--s", "1");
    mood("idle");
    say.textContent = "okay. again. be honest.";
  });

  document.addEventListener("pointermove", (e) => {
    look(e.clientX, e.clientY);
    if (!result.hidden || no.hidden) return;
    if (nearest(e.clientX, e.clientY, no.getBoundingClientRect()) < (e.pointerType === "mouse" ? 95 : 60)) {
      if (tries > 3 && !faking && Math.random() < 0.2) {
        faking = true;
        say.textContent = "…";
        setTimeout(() => { faking = false; flee(e.clientX, e.clientY); }, 500);
      } else if (!faking) flee(e.clientX, e.clientY);
    }
  });

  document.addEventListener("pointerdown", (e) => {
    if (!result.hidden || no.hidden) return;
    if (e.target === no) {
      e.preventDefault();
      if (no.hasPointerCapture && no.hasPointerCapture(e.pointerId)) no.releasePointerCapture(e.pointerId);
      flee(e.clientX, e.clientY);
    } else if (nearest(e.clientX, e.clientY, no.getBoundingClientRect()) < 70) {
      flee(e.clientX, e.clientY);
    }
  });

  addEventListener("resize", () => {
    if (!fled || no.hidden) return;
    const r = no.getBoundingClientRect();
    no.style.left = Math.max(14, Math.min(r.left, innerWidth - r.width - 14)) + "px";
    no.style.top = Math.max(56, Math.min(r.top, innerHeight - r.height - 14)) + "px";
  });
})();
</script>
</body>
</html>
